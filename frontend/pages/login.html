<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduCRM - Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page auth-shell">
    <div class="auth-card">
        <div class="auth-title">
            <div class="auth-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" class="icon">
                    <path d="M22 10L12 5 2 10l10 5 10-5Z"></path>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                </svg>
            </div>
            <h1>Welcome Back</h1>
            <p>Login to your EduCRM account</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Your Email Address *</label>
                <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
                <span class="form-error" id="emailError"></span>
            </div>
            <div class="form-group">
                <label>Password *</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                <span class="form-error" id="passwordError"></span>
            </div>
            <div class="form-group">
                <label>Account Type *</label>
                <select id="userType" class="form-control" required>
                    <option value="">Select account type</option>
                    <option value="individual">Individual (Teacher/Staff)</option>
                    <option value="company">Company (Institution)</option>
                </select>
            </div>
            <div class="form-check">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">Remember me</label>
                <a href="forgot-password.html" class="form-link">Forgot Password?</a>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; padding:0.85rem;">Login</button>
        </form>

        <div class="form-footer">
            <p>Don't have an account? <a href="signup.html">Create Account</a></p>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="../js/config.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
