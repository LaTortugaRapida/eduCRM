<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduCRM - Set New Password</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page auth-shell">
    <div class="auth-card">
        <div class="auth-title">
            <div class="auth-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" class="icon">
                    <rect width="18" height="11" x="3" y="11" rx="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h1>Set New Password</h1>
            <p>Create a new password for your EduCRM account</p>
        </div>

        <form id="resetPasswordForm">
            <div class="form-group">
                <label>New Password *</label>
                <input type="password" id="newPassword" class="form-control" placeholder="Minimum 8 characters" required minlength="8">
                <div class="password-meter"><div class="pw-bar" id="resetPwBar"></div></div>
                <span class="form-error" id="newPasswordError"></span>
            </div>
            <div class="form-group">
                <label>Confirm Password *</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required>
                <span class="form-error" id="confirmPasswordError"></span>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; padding:0.85rem;">Update Password</button>
        </form>

        <div class="form-footer">
            <p><a href="login.html">Back to Login</a></p>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="../js/config.js"></script>
    <script src="../js/reset-password.js"></script>
</body>
</html>
