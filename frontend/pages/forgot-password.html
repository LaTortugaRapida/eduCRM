<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduCRM - Forgot Password</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page auth-shell">
    <div class="auth-card">
        <div class="auth-title">
            <div class="auth-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" class="icon">
                    <path d="M4 4h16v16H4z"></path>
                    <path d="M8 8h8"></path>
                    <path d="M8 12h8"></path>
                    <path d="M8 16h5"></path>
                </svg>
            </div>
            <h1>Reset Password</h1>
            <p>Enter your email to receive a reset link</p>
        </div>
        <form id="forgotPasswordForm">
            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
                <span class="form-error" id="emailError"></span>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; padding:0.85rem;">Send Reset Link</button>
        </form>
        <div id="resetLinkPanel" class="reset-link-panel" hidden>
            <strong>Local reset link</strong>
            <p>Email is not configured, so use this link while developing locally.</p>
            <a id="resetLinkAnchor" href="#">Open reset page</a>
        </div>
        <div class="form-footer">
            <p><a href="login.html">Back to Login</a></p>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="../js/env.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/forgot-password.js"></script>
</body>
</html>
