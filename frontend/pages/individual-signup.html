<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduCRM - Individual Sign Up</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page auth-shell">
    <div class="signup-container">
        <div class="signup-card">
            <div class="signup-header">
                <h1>
                    <span class="heading-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" class="icon">
                            <path d="M22 10L12 5 2 10l10 5 10-5Z"></path>
                            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                        </svg>
                    </span>
                    EduCRM
                </h1>
                <p>Create your individual account</p>
            </div>

            <form id="individualSignupForm">
                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                    <span class="error-message" id="nameError"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" placeholder="+1 234 567 8900" required>
                    <span class="error-message" id="phoneError"></span>
                </div>

                <div class="form-group">
                    <label for="position">Position</label>
                    <select id="position">
                        <option value="">Select your position</option>
                        <option value="Teacher">Teacher</option>
                        <option value="Administrator">Administrator</option>
                        <option value="Principal">Principal</option>
                        <option value="Counselor">Counselor</option>
                        <option value="Staff">Staff</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" placeholder="Minimum 8 characters" required minlength="8">
                    <span class="error-message" id="passwordError"></span>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password *</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>
                    <span class="error-message" id="confirmPasswordError"></span>
                </div>

                <button type="submit" class="submit-btn">Create Account</button>

                <div class="form-footer">
                    <p>Already have an account? <a href="login.html">Login here</a></p>
                    <p>Registering as a company? <a href="company-signup.html">Company Sign Up</a></p>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="../js/config.js"></script>
    <script src="../js/individual-signup.js"></script>
</body>
</html>
