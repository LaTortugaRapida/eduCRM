[build]
  command = "npm run build:netlify"
  publish = "frontend"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/reset-password/*"
  to = "/pages/reset-password.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
